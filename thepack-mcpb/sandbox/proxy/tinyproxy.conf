Port 8888
Listen 0.0.0.0
Timeout 600

# Clients come only from the private internal docker network, so allowing all
# client IPs here is fine — the network itself is the access boundary.
Allow 0.0.0.0/0

# Default-deny domain allowlist. The allowed domains are written into this file
# at container start by entrypoint.sh (from THEPACK_SERVER_URL + Anthropic +
# EGRESS_ALLOW). tinyproxy matches these against both plain HTTP hosts and HTTPS
# CONNECT targets.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On

# Only allow tunnelling to standard web ports.
ConnectPort 443
ConnectPort 80
