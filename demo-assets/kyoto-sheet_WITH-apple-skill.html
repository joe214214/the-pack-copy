<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyoto in Spring</title>
<style>
  :root {
    color-scheme: dark;
    --sheet-radius: 22px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  body {
    position: fixed;
    inset: 0;
  }

  .stage {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 22% 12%, rgba(255,255,255,0.40), transparent 42%),
      radial-gradient(circle at 82% 8%, rgba(255,222,232,0.55), transparent 40%),
      radial-gradient(ellipse at 50% 100%, rgba(30,20,50,0.55), transparent 55%),
      linear-gradient(175deg, #ffe1ec 0%, #ffc2d6 20%, #f496b8 40%, #cd7fc0 60%, #8b6bbf 80%, #4d4390 100%);
    overflow: hidden;
  }

  .stage::before,
  .stage::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.5), rgba(255,255,255,0) 70%);
    filter: blur(1px);
  }
  .stage::before { width: 34vw; height: 34vw; top: 6%; left: -8%; opacity: 0.55; }
  .stage::after  { width: 22vw; height: 22vw; top: 18%; right: 4%; opacity: 0.4; }

  .stage-content {
    position: absolute;
    left: 0;
    right: 0;
    bottom: max(9vh, 48px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 0 28px;
    text-align: center;
  }

  .title {
    margin: 0;
    color: #fff;
    font-size: clamp(2.1rem, 8vw, 3.2rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-shadow: 0 2px 18px rgba(30, 15, 45, 0.35), 0 1px 3px rgba(0,0,0,0.25);
  }

  .cta {
    appearance: none;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.005em;
    padding: 15px 30px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(20, 10, 40, 0.28);
    cursor: pointer;
    transform: translateZ(0) scale(1);
    transition: transform 120ms ease-out, background 120ms ease-out;
  }
  .cta:active {
    transform: scale(0.96);
    background: rgba(255,255,255,0.3);
  }

  .backdrop {
    position: absolute;
    inset: 0;
    background: #0a0612;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }

  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 68vh;
    max-height: 720px;
    border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
    background: rgba(28, 22, 40, 0.72);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.12);
    border-bottom: none;
    box-shadow: 0 -20px 60px rgba(0,0,0,0.45);
    color: #fff;
    will-change: transform;
    touch-action: none;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
  }

  .handle-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 30px;
    padding-top: 8px;
    cursor: grab;
    touch-action: none;
  }
  .handle-bar:active { cursor: grabbing; }

  .grab-handle {
    width: 38px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.38);
  }

  .sheet-content {
    padding: 6px 28px 34px;
    overflow: hidden;
  }

  .sheet-content h2 {
    margin: 4px 0 10px;
    font-size: clamp(1.5rem, 6vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -0.015em;
  }

  .sheet-content p {
    margin: 0 0 22px;
    color: rgba(255,255,255,0.78);
    font-size: 1rem;
    line-height: 1.5;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 13px 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 0.98rem;
  }
  .detail-row:last-child { border-bottom: 1px solid rgba(255,255,255,0.1); }

  .detail-label { color: rgba(255,255,255,0.6); }
  .detail-value { color: #fff; font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .cta { transition: none; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="stage-content">
      <h1 class="title">Kyoto in Spring</h1>
      <button class="cta" id="openBtn" type="button">Show details</button>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="handle-bar" id="handleBar">
      <div class="grab-handle"></div>
    </div>
    <div class="sheet-content">
      <h2>Kyoto in Spring</h2>
      <p>Nine days wandering bamboo groves and blossom-lined canals while the city turns pink for exactly one week a year.</p>
      <div class="detail-row">
        <span class="detail-label">Dates</span>
        <span class="detail-value">Apr 3 &ndash; Apr 9</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Travelers</span>
        <span class="detail-value">2 adults</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Hotel</span>
        <span class="detail-value">Gion Machiya</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Budget</span>
        <span class="detail-value">$2,400</span>
      </div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('backdrop');
  var handleBar = document.getElementById('handleBar');
  var openBtn = document.getElementById('openBtn');

  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function Spring(value, onUpdate) {
    this.value = value;
    this.velocity = 0;
    this.target = value;
    this.damping = 1;
    this.response = 0.3;
    this.onUpdate = onUpdate;
    this._raf = null;
    this._last = 0;
  }

  Spring.prototype.configure = function (damping, response) {
    this.damping = damping;
    this.response = response;
  };

  Spring.prototype.cancel = function () {
    if (this._raf) {
      cancelAnimationFrame(this._raf);
      this._raf = null;
    }
  };

  Spring.prototype.jumpTo = function (value) {
    this.cancel();
    this.value = value;
    this.velocity = 0;
    this.onUpdate(this.value);
  };

  Spring.prototype.setTarget = function (target, incomingVelocity) {
    this.target = target;
    if (typeof incomingVelocity === 'number') this.velocity = incomingVelocity;
    this._start();
  };

  Spring.prototype._start = function () {
    if (this._raf) return;
    var self = this;
    self._last = performance.now();

    function step(now) {
      var dt = Math.min((now - self._last) / 1000, 1 / 30);
      self._last = now;

      var angularFreq = (2 * Math.PI) / self.response;
      var stiffness = angularFreq * angularFreq;
      var dampingCoef = 2 * self.damping * angularFreq;

      var accel = -stiffness * (self.value - self.target) - dampingCoef * self.velocity;
      self.velocity += accel * dt;
      self.value += self.velocity * dt;

      self.onUpdate(self.value);

      var settled = Math.abs(self.value - self.target) < 0.4 && Math.abs(self.velocity) < 18;
      if (settled) {
        self.value = self.target;
        self.velocity = 0;
        self.onUpdate(self.value);
        self._raf = null;
        return;
      }
      self._raf = requestAnimationFrame(step);
    }
    self._raf = requestAnimationFrame(step);
  };

  var closedOffset = 0;
  var isOpen = false;

  function measure() {
    closedOffset = sheet.getBoundingClientRect().height + 40;
    if (!isOpen && !dragging) spring.jumpTo(closedOffset);
  }

  function applyPosition(pos) {
    sheet.style.transform = 'translateY(' + pos + 'px)';
    var ratio = 1 - Math.min(Math.max(pos / closedOffset, 0), 1);
    backdrop.style.opacity = (ratio * 0.55).toFixed(3);
    backdrop.style.pointerEvents = ratio > 0.02 ? 'auto' : 'none';
    sheet.setAttribute('aria-hidden', ratio < 0.02 ? 'true' : 'false');
  }

  var spring = new Spring(closedOffset, applyPosition);

  function openSheet(initialVelocity) {
    isOpen = true;
    spring.configure(reducedMotion ? 1 : 0.82, reducedMotion ? 0.32 : 0.34);
    spring.setTarget(0, initialVelocity || 0);
  }

  function closeSheet(initialVelocity) {
    isOpen = false;
    spring.configure(reducedMotion ? 1 : 0.86, reducedMotion ? 0.28 : 0.3);
    spring.setTarget(closedOffset, initialVelocity || 0);
  }

  openBtn.addEventListener('click', function () { openSheet(); });
  backdrop.addEventListener('click', function () { closeSheet(); });

  function rubberband(overshoot, dimension, constant) {
    constant = constant || 0.55;
    return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
  }

  function project(velocity, decelerationRate) {
    decelerationRate = decelerationRate || 0.998;
    return (velocity / 1000) * decelerationRate / (1 - decelerationRate);
  }

  var dragging = false;
  var dragStartY = 0;
  var dragStartPos = 0;
  var samples = [];

  function recordSample(y) {
    var now = performance.now();
    samples.push({ t: now, y: y });
    while (samples.length && now - samples[0].t > 100) samples.shift();
  }

  function releaseVelocity() {
    if (samples.length < 2) return 0;
    var first = samples[0];
    var last = samples[samples.length - 1];
    var dt = last.t - first.t;
    if (dt <= 0) return 0;
    return ((last.y - first.y) / dt) * 1000;
  }

  function onPointerDown(e) {
    dragging = true;
    spring.cancel();
    dragStartY = e.clientY;
    dragStartPos = spring.value;
    samples = [];
    recordSample(e.clientY);
    handleBar.setPointerCapture(e.pointerId);
    document.body.style.userSelect = 'none';
  }

  function onPointerMove(e) {
    if (!dragging) return;
    var delta = e.clientY - dragStartY;
    var raw = dragStartPos + delta;
    var clamped;
    if (raw < 0) {
      clamped = -rubberband(-raw, closedOffset);
    } else if (raw > closedOffset) {
      clamped = closedOffset + rubberband(raw - closedOffset, closedOffset);
    } else {
      clamped = raw;
    }
    recordSample(e.clientY);
    spring.jumpTo(clamped);
  }

  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    try { handleBar.releasePointerCapture(e.pointerId); } catch (err) {}

    var velocity = releaseVelocity();
    var projected = spring.value + project(velocity);
    var targets = [0, closedOffset];
    var nearest = targets.reduce(function (a, b) {
      return Math.abs(b - projected) < Math.abs(a - projected) ? b : a;
    });

    if (nearest === 0) openSheet(velocity);
    else closeSheet(velocity);
  }

  handleBar.addEventListener('pointerdown', onPointerDown);
  handleBar.addEventListener('pointermove', onPointerMove);
  handleBar.addEventListener('pointerup', onPointerUp);
  handleBar.addEventListener('pointercancel', onPointerUp);

  window.addEventListener('resize', measure);
  measure();
})();
</script>
</body>
</html>
